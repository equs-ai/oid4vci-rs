name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: "true"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Crate identity
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0] | "name       \(.name)\nversion    \(.version)\nlicense    \(.license)\nrepository \(.repository)\nedition    \(.edition)"'
          echo "trigger    ${{ github.event_name }}"
          echo "ref        ${{ github.ref }}"
          echo "ref_name   ${{ github.ref_name }}"
          echo "sha        ${{ github.sha }}"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag      $tag"
          echo "manifest $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "tag and manifest agree"

      - name: Test
        run: cargo test --verbose

      - name: Files that would ship
        run: cargo package --list

      - name: Pack and verify
        run: cargo package --verbose

      - name: Inspect the tarball
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tarball="target/package/$crate-$version.crate"
          ls -l "$tarball"
          echo "sha256 $(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "files  $(tar -tzf "$tarball" | wc -l)"
          echo "--- manifest as published ---"
          tar -xzOf "$tarball" "$crate-$version/Cargo.toml"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error

      - name: Not publishing
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "::notice::rehearsal only - $crate $version was packed and verified, nothing was uploaded"
          echo "to publish for real, add a cargo publish step with CARGO_REGISTRY_TOKEN"
